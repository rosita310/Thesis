services:
  postgres:
    container_name: postgres
    image: postgres:14.0-bullseye
    env_file:
      - ../.env
    restart: always
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres/pgdata:/var/lib/postgresql/data/pgdata